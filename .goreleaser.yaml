version: 2

project_name: k8scli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: k8scli
    binary: k8scli
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/1985epma/k8scli/cmd.version={{ .Version }}
      - -X github.com/1985epma/k8scli/cmd.commit={{ .Commit }}
      - -X github.com/1985epma/k8scli/cmd.date={{ .Date }}

archives:
  - id: default
    ids:
      - k8scli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

  # Standalone binaries (k8scli_<version>_<os>_<arch>[.exe]) uploaded as-is,
  # replacing the old shell step that copied files out of dist/ by hand.
  - id: binaries
    ids:
      - k8scli
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

# Keyless signature of the checksum file (needs `id-token: write` in the workflow).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

# SPDX SBOM for every archive (needs syft in PATH).
sboms:
  - id: archive-sboms
    artifacts: archive
    ids:
      - default

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: 1985epma
    name: k8scli
  draft: false
  prerelease: auto

dockers_v2:
  - id: k8scli
    ids:
      - k8scli
    images:
      - ghcr.io/1985epma/k8scli
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.title: k8scli
      org.opencontainers.image.description: Kubernetes CLI helper tool
      org.opencontainers.image.source: https://github.com/1985epma/k8scli
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

brews:
  - name: k8scli
    ids:
      - default
    repository:
      owner: 1985epma
      name: homebrew-k8scli
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/1985epma/k8scli
    description: Kubernetes CLI helper tool
    license: MIT
    install: |
      bin.install "k8scli"
      generate_completions_from_executable(bin/"k8scli", "completion")
    test: |
      assert_match version.to_s, shell_output("#{bin}/k8scli version")

nfpms:
  - id: default
    ids:
      - k8scli
    package_name: k8scli
    vendor: k8scli
    maintainer: 1985epma
    description: Kubernetes CLI helper tool
    license: MIT
    homepage: https://github.com/1985epma/k8scli
    formats:
      - deb
      - rpm
