<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>k8scli Console</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/pages.css">
  <link rel="stylesheet" href="/forms.css">
  <link rel="stylesheet" href="/helm.css">
  <link rel="stylesheet" href="/resilience.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div id="app" data-collapsed="false" data-nav-open="false">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
    <div id="scrim" hidden></div>
    <div class="shell">
      <header id="topbar" class="topbar"></header>
      <div id="banner"></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Pod logs"></aside>
  <div id="modal" class="modal card" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
