name: SAST

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Always the newest patch release: go.mod's minimum (1.26.0) ships a
          # stdlib with known vulnerabilities that govulncheck rightly rejects.
          go-version: stable
          check-latest: true

      - name: Install SAST tools
        run: |
          set -eu
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOBIN="$RUNNER_TEMP/bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run gosec
        run: gosec ./...
