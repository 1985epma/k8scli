# The sample system of the DR lab, minus the CloudNativePG database (shop-db.yaml).
#
#   tier 0  databases   shop-db (CloudNativePG, applied from shop-db.yaml)   legacy-db (plain StatefulSet)
#   tier 1  api         Deployment, 2 replicas, depends on the databases
#   tier 2  web         Deployment, 2 replicas, depends on api
#
# Everything is small on purpose: the lab shares a Mac with Docker Desktop.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
---
# ---- tier 0: a plain StatefulSet database (tests the generic "statefulset" path) ----
apiVersion: v1
kind: Service
metadata:
  name: legacy-db
  namespace: shop
  labels: {app: legacy-db, app.kubernetes.io/part-of: shop}
spec:
  clusterIP: None
  selector: {app: legacy-db}
  ports:
    - {name: redis, port: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: legacy-db
  namespace: shop
  labels: {app: legacy-db, app.kubernetes.io/part-of: shop, tier: "0"}
spec:
  serviceName: legacy-db
  replicas: 2
  selector:
    matchLabels: {app: legacy-db}
  template:
    metadata:
      labels: {app: legacy-db, app.kubernetes.io/part-of: shop, tier: "0"}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 100Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legacy-db
  namespace: shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: legacy-db}
---
# ---- tier 1: api ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: {app: api, app.kubernetes.io/part-of: shop, tier: "1"}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, app.kubernetes.io/part-of: shop, tier: "1"}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api}
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - {name: http, containerPort: 9898}
          env:
            - {name: DATABASE_HOST, value: shop-db-rw}
            - {name: CACHE_HOST, value: legacy-db}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
  labels: {app: api, app.kubernetes.io/part-of: shop}
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
---
# ---- tier 2: web ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels: {app: web, app.kubernetes.io/part-of: shop, tier: "2"}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, app.kubernetes.io/part-of: shop, tier: "2"}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - {name: http, containerPort: 9898}
          env:
            - {name: PODINFO_BACKEND_URL, value: "http://api.shop.svc.cluster.local"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
  labels: {app: web, app.kubernetes.io/part-of: shop}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: web}
---
# kind has no metrics-server, so this HPA reads <unknown> for CPU. It still tests that scaling
# web to 0 and back leaves the HPA settings untouched.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: shop
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shop-report
  namespace: shop
  labels: {app: shop-report, app.kubernetes.io/part-of: shop}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo shop report at $(date -u +%FT%TZ)"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
