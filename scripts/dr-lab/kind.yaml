# Three-node kind cluster for the k8scli disaster-recovery lab.
# One control plane and two workers, so node drain, node stop/start and
# pod spreading can be tested for real.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8scli-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4
  - role: worker
    image: kindest/node:v1.36.4
  - role: worker
    image: kindest/node:v1.36.4
